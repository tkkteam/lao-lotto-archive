name: Auto Update Lao Lottery

on:
  schedule:
    # รันทุกวันจันทร์-เสาร์ เวลา 13:30 UTC (20:30 เวลาไทย) หยุดวันอาทิตย์
    - cron: '30 14 * * 1-5'
  workflow_dispatch:  # รันด้วยมือได้

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 lxml

      - name: Run lottery scraper
        run: |
          echo "Starting lottery scraper..."
          python lottoscrape-sanook.py
          echo "Scraper exit code: $?"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lottonumbers/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M:%S')" && git push origin HEAD:$(git rev-parse --abbrev-ref HEAD))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
