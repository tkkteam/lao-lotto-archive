name: Auto Update Lao Lottery

on:
  schedule:
    # รันทุกวันจันทร์ พุธ ศุกร์ เวลา 13:30 UTC (20:30 เวลาไทย)
    - cron: '30 13 * * 1,3,5'
  workflow_dispatch:  # รันด้วยมือได้

jobs:
  update-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run lottery scraper
        run: |
          python lottoscrape-sanook.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lottonumbers/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M:%S')" && git push origin master)
