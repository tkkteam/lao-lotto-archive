name: Auto Update Lao Lottery

on:
  workflow_dispatch:

concurrency:
  group: lottery-job
  cancel-in-progress: true

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Run lottery scraper
        run: |
          set -e
          echo "=== START SCRAPER ==="
          python lottoscrape-sanook.py || exit 1
          echo "=== END SCRAPER ==="

      - name: Debug output files
        run: |
          echo "=== FILES IN REPO ==="
          ls -la
          echo "=== FILES IN lottonumbers ==="
          ls -la lottonumbers || echo "No folder found"

      - name: Commit and push if changed
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add lottonumbers/ || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase
            git push
          fi
